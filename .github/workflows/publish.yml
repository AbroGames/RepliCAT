# This workflow will build, test and publish the package to NuGet
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Publish

on:
  push:
    branches: [ "master" ]

jobs:
  call-build:
    uses: ./.github/workflows/build.yml

  publish:

    runs-on: ubuntu-latest
    needs: call-build

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack RepliCAT --configuration Release --output .
      - name: Push
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json
